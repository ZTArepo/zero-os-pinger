name: Zero OS watcher ping
on:
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: watcher-ping
  cancel-in-progress: false
jobs:
  ping:
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Curl the watcher route (auth via secret)
        run: |
          curl -fsS --max-time 280 \
            -H "Authorization: Bearer ${{ secrets.ZOS_CRON_SECRET }}" \
            "${{ vars.ZOS_CRON_URL }}"
