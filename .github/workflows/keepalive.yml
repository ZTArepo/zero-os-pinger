name: Keepalive
on:
  schedule:
    - cron: "23 6 1 * *" # monthly — resets GitHub's 60-day schedule-disable timer
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "zero-os-pinger"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: reset scheduled-workflow inactivity timer"
          git push
